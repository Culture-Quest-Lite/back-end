<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Đặt lại mật khẩu - Culture Quest Lite</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0d1b2a;
      padding: 40px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .card__header {
      background: linear-gradient(135deg, #f97316 0%, #ec4899 50%, #8b5cf6 100%);
      padding: 36px 30px;
      text-align: center;
    }

    .card__header h1 {
      color: #ffffff;
      margin: 0;
      font-size: 22px;
      font-weight: 700;
    }

    .card__header p {
      color: rgba(255, 255, 255, 0.9);
      margin: 8px 0 0;
      font-size: 14px;
    }

    .card__body {
      padding: 30px;
      text-align: center;
    }

    .card__body p {
      color: #64748b;
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 24px;
    }

    .button {
      display: inline-block;
      background: linear-gradient(135deg, #f97316 0%, #ec4899 100%);
      color: #ffffff;
      text-decoration: none;
      padding: 14px 36px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
    }

    .link-web {
      display: block;
      margin-top: 22px;
      color: #8b5cf6;
      font-size: 13px;
    }

    .note {
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.5;
      margin: 22px 0 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card__header">
      <h1>Đặt Lại Mật Khẩu</h1>
      <p>Culture Quest Lite</p>
    </div>
    <div class="card__body">
      <p>Đang mở ứng dụng Culture Quest Lite để bạn đặt lại mật khẩu...</p>
      <a class="button" href="{{DEEP_LINK}}" id="open-app">Mở trong ứng dụng</a>
      <a class="link-web" href="{{WEB_LINK}}">Hoặc đổi mật khẩu trên trình duyệt</a>
      <p class="note">Liên kết có hiệu lực trong 15 phút và chỉ dùng được một lần.</p>
    </div>
  </div>
  <script>
    // Tự mở app ngay khi trang hiển thị; máy chưa cài app thì vẫn còn nút và link web bên trên.
    window.setTimeout(function () {
      window.location.href = document.getElementById("open-app").getAttribute("href");
    }, 300);
  </script>
</body>
</html>
